# Обновления зависимостей (аудит покрытия 30.07).
#
# Зачем: `pip-audit` в CI говорит «в этой версии есть CVE», но сам не приносит
# фикс. Dependabot приносит — иначе апдейт зависимостей делается «когда-нибудь»,
# то есть никогда. Насколько это работает именно у нас — сразу ниже, и ответ
# разный для двух половин файла.
#
# Честно про pip-половину (уточнено ревью PR #152): сегодня она — заготовка на
# будущее, фиксов по CVE от неё ждать не следует.
#   * Рантайм-зависимости объявлены через `>=` (`pyproject.toml:10-55`) — все,
#     кроме `anthropic`: у него с 21.08 стоит ещё и верхняя граница `<1` (#302).
#     По таким требованиям Dependabot молчит: новая версия им уже удовлетворяет,
#     и менять в файле нечего (`fastapi>=0.115` при выходе 0.130). Верхняя
#     граница на это молчание не влияет: важно только «удовлетворяет ли новая
#     версия тому, что записано», а не есть ли у требования потолок. Открытый
#     баг dependabot-core#9105; `versioning-strategy` его не обходит.
#   * Лок-файла в проекте нет, а без него транзитивные зависимости Dependabot не
#     обновляет вовсе — то есть главный мотив («CVE в транзитивной зависимости»)
#     именно им сейчас и не закрывается.
#   * Единственный жёсткий пин — `ruff`, и его двигать автоматически запрещено
#     (см. `ignore` ниже).
# Половина оживёт, когда у проекта появится лок-файл; работает сегодня
# github-actions-половина — там пины реальные (`actions/checkout@v7`).
#
# Настройки выбраны под режим проекта (код пишут LLM-сессии, ревью — вторым
# аккаунтом, время основателя дорого):
#   * weekly, а не daily — PR-спам съедает ревью-бюджет;
#   * groups — один PR на эко-систему вместо десяти отдельных;
#   * open-pull-requests-limit: 3 — очередь не разрастается, пока прошлые висят.
# Dependabot-PR проходит тот же CI и то же обязательное одобрение, что любой
# другой: автомержа здесь нет и не планируется.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # Единственный жёсткий пин проекта (`pyproject.toml:59-63`) — и там прямо
      # написано, почему двигать его автоматически нельзя: незапиненный ruff
      # обновился до 0.16.0 и покрасил README всего репозитория, апгрейд обязан
      # быть осознанным PR. Без этого игнора Dependabot приносил бы ровно такой
      # PR на каждый релиз ruff — и краснил бы обязательный check.
      - dependency-name: ruff
      # Верхняя граница `anthropic<1` (`pyproject.toml:22-29`) — не осторожность,
      # а заграждение по факту: мажор 1.0.0 (20.08.2026) переехал с `httpx` на
      # `httpx2`, обязательный `check` краснеет у КАЖДОГО PR репозитория, а при
      # `enforce_admins: true` это останавливает мержи целиком (#302). Без игнора
      # бот приносит один и тот же красный PR на каждый релиз SDK: первый такой,
      # #314, закрыт 25.08 непроходимым `check`.
      #
      # Форма записи — `versions`, и это не стилистика (#319). Прежняя запись,
      # `update-types: ["version-update:semver-major"]`, не подавляла НИЧЕГО:
      # ветка `update-types` в `ignore_condition.rb` (метод `versions_by_type`)
      # открывается строкой `return [] unless version`, где `version` — ТЕКУЩАЯ
      # версия зависимости, а у требования-диапазона её нет (`parser.py`,
      # `version_from_req`: версия берётся, только если спецификатор ровно один
      # и его оператор `==`/`===`, а у `anthropic>=0.69,<1` их два). Игнор
      # разворачивался в пустой список. Проверено прогоном, а не чтением: PR #315
      # с той записью смержен 25.08 в 10:46:17Z, и робот, читавший уже новую
      # конфигурацию, принёс тот же самый PR #316 в 10:48:05Z. Список `versions`
      # подставляется в `ignored_versions` безусловно, мимо проверки на текущую
      # версию, — поэтому работает он. Голая запись `ruff` выше уходит во вторую
      # строку `ignored_versions` (`return [ALL_VERSIONS] if versions.empty? &&
      # transformed_update_types.empty?` — то есть `>= 0` на всё): текущая версия
      # ей тоже не нужна, потому она и не ломалась.
      #
      # ЦЕНА ЭТОЙ ФОРМЫ, и она обязана быть здесь написана: `ignored_versions`
      # начинается со строки `return versions if security_updates_only` — то есть
      # `versions` глушит и security-обновления, чего `update-types` не делал.
      # Но ровно те, что живут на `>= 1`: список уходит в `ignore_requirements`,
      # и `fetch_lowest_security_fix_version` фильтрует ими кандидатов
      # (`common/lib/dependabot/package/package_latest_version_finder.rb:405` —
      # `filter_ignored_versions` отбрасывает версии, попадающие в требование
      # игнора). CVE, починенная внутри 0.x, PR не породит ни с игнором, ни без
      # него — там срабатывает тот же `skip_pyproject_update?`. Запись не
      # безобидна. Для нас это приемлемо: детекция и ремедиация у нас разведены —
      # о CVE скажет `pip-audit` в job `audit` (ревью PR #152),
      # а фикс всё равно приедет руками, потому что переезд на 1.x трогает
      # `ai/gateway` и живёт отдельной задачей #304. Больше игнор не стоит нам
      # ничего: любой релиз 0.x требованию `>=0.69,<1` уже удовлетворяет, менять
      # в файле нечего, и бот по нему молчит без всякого игнора («честно про
      # pip-половину» выше; в исходнике это `skip_pyproject_update?` —
      # «новая версия требованию удовлетворяет, лок-файла нет, стратегия не
      # `BumpVersions`»). Эмпирика согласна: за все прогоны с 04.08.2026 (день,
      # когда pip-экосистема появилась в этом файле, — `dd9a5a4`) по 25.08.2026
      # у pip был ровно один апдейт — тот самый `<1` → `<2` (PR #314 и его
      # повтор #316), то есть ровно тот, чья версия в требование не влезла.
      #
      # СНЯТЬ ТЕМ ЖЕ PR, который закрывает #304 (переезд на SDK 1.x). У этой
      # формы причина своя: `>= 1` — буквальный диапазон, он ничего не
      # «пересчитывает» после переезда, а продолжает глушить всё, что `>= 1`.
      # Кусается это так: после переезда требование станет `>=1.x,<2` (или
      # `>=1.x`), и ЕДИНСТВЕННЫЙ класс PR, который такое требование вообще
      # порождает, — сдвиг верхней границы на следующем мажоре (`<2` → `<3`),
      # плюс security-фикс, за которым придётся уйти с 1.x, — останется
      # заглушен уже без причины и без срока, и снова молча. Про МИНОРНЫЕ
      # обновления SDK запись `>= 1` тоже верна буквально (1.1, 1.2 … в
      # диапазон входят), но в PR это не выльется ни с игнором, ни без него:
      # релиз внутри диапазона требованию удовлетворяет, а без лок-файла это
      # тот самый `skip_pyproject_update?` выше — робот молчит и так.
      - dependency-name: anthropic
        versions: [">= 1"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # Экшены пинятся тегом (`actions/checkout@v7`), то есть сами не обновляются;
  # заброшенный тег — это и устаревший рантайм Node, и невыпущенные фиксы.
  # Мажорные обновления экшенов бот приносит наравне с остальными и это осознанно:
  # мажор экшена надо видеть глазами (первый его выход, PR #188, привёз checkout
  # 4→7 и setup-python 5→7 — набор входов не изменился, поехал только рантайм Node).
  #
  # Пин ТЕГОМ, а не SHA — решение основателя от 04.08 по итогам ревью PR #188.
  # Тег подвижен: владелец чужого репозитория может перевесить его на другой
  # коммит, и мы исполним новый код молча (класс инцидента `tj-actions`, 2025).
  # Массовый пин по SHA отклонён: оба наших экшена — первосторонние, от самого
  # GitHub, а 40 символов вместо `@v7` платит читаемостью основатель, который по
  # этим файлам учится. Взамен закрыт более вероятный путь: Settings → Actions →
  # разрешены только экшены GitHub, то есть третьесторонний экшен нельзя завести
  # молча. **Правило: первый не-`actions/*` экшен пинится по SHA с первого дня**,
  # и тогда же включается `sha_pinning_required` в настройках репозитория.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
