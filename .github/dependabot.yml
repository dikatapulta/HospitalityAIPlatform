# Обновления зависимостей (аудит покрытия 30.07; лок-файл — #305, ADR-026).
#
# Зачем: `pip-audit` в CI говорит «в этой версии есть CVE», но сам не приносит
# фикс. Dependabot приносит — иначе апдейт зависимостей делается «когда-нибудь»,
# то есть никогда.
#
# Python-половина — экосистема `uv`: зависимости ставятся строго по `uv.lock`
# (`ops/install-deps.sh`, ADR-026), и робот обновляет именно его — версии внутри
# диапазонов `pyproject.toml`, транзитивные тоже, и security-обновления (для uv
# GitHub включил их 16.12.2025). PR робота — тот же осознанный апгрейд, что
# руками: новые версии видны в diff лока, CI гоняет ровно их. До лока (#305)
# pip-половина молчала: по `>=`-требованиям без лок-файла менять в файле нечего
# (dependabot-core#9105, разбор — ревью PR #152).
#
# Настройки выбраны под режим проекта (код пишут LLM-сессии, ревью — вторым
# аккаунтом, время основателя дорого):
#   * weekly, а не daily — PR-спам съедает ревью-бюджет;
#   * groups — один PR на эко-систему вместо десяти отдельных;
#   * open-pull-requests-limit: 3 — очередь не разрастается, пока прошлые висят.
# Dependabot-PR проходит тот же CI и то же обязательное одобрение, что любой
# другой: автомержа здесь нет и не планируется.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # Форму каждой записи сверяет с требованием в `pyproject.toml` тест
      # `tests/test_dependabot_ignore_form.py` (#322): `update-types` — только
      # у пина `==`, у диапазона — `versions`, голая запись — только у пина.
      #
      # Единственный жёсткий пин проекта — `ruff==` в `pyproject.toml`, и там
      # прямо написано, почему двигать его автоматически нельзя: незапиненный
      # ruff обновился до 0.16.0 и покрасил README всего репозитория, апгрейд
      # обязан быть осознанным PR вместе с переформатированием кода.
      - dependency-name: ruff
      # Верхняя граница `anthropic<1` — заграждение по факту: мажор 1.0.0
      # (20.08.2026) переехал с `httpx` на `httpx2`, и обязательный `check`
      # краснел у КАЖДОГО PR репозитория (#302); переезд на 1.x трогает
      # `ai/gateway` и живёт отдельной задачей #304. Без игнора робот приносит
      # один и тот же красный PR «расширить границу» на каждый релиз 1.x
      # (#314, #316).
      #
      # Форма — `versions`, и это не стилистика (#319): в pip-экосистеме без
      # лока `update-types` раскрывается от ТЕКУЩЕЙ версии зависимости, а у
      # диапазона `>=0.69,<1` её не было — запись молча ничего не глушила
      # (PR #315 смержен, и через две минуты робот принёс тот же PR #316).
      # С `uv.lock` текущая версия у робота есть, но `versions` подставляется
      # безусловно и работает в обоих случаях — эту форму и держит щит.
      #
      # ЦЕНА ЭТОЙ ФОРМЫ: `versions` глушит и security-обновления на `>= 1` —
      # CVE, починенную только в 1.x, робот не принесёт. О ней скажет
      # `pip-audit` (job `audit`), а фикс — тот же переезд #304. CVE, починенная
      # внутри 0.x, придёт обычным обновлением лока.
      #
      # СНЯТЬ ТЕМ ЖЕ PR, который закрывает #304: после переезда требование станет
      # `>=1.x,<2`, и запись `>= 1` молча заглушит по нему ВСЁ — минорные 1.x
      # в лок и security-фиксы.
      - dependency-name: anthropic
        versions: [">= 1"]
      # У `openai<4` (ADR-020) игнора нет — это решение, а не пропуск
      # (процесс-батч #275, 09.10.2026). Запись `anthropic` выше поставлена по
      # факту, после красного PR бота; заранее поставленный игнор глушил бы
      # security-обновления на `>= 4` и мажор, который может прийти зелёным.
      # Принесёт бот красный сдвиг `<4` → `<5` — тогда игнор той же формы `versions`.
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # Экшены пинятся тегом (`actions/checkout@v7`), то есть сами не обновляются;
  # заброшенный тег — это и устаревший рантайм Node, и невыпущенные фиксы.
  # Мажорные обновления экшенов бот приносит наравне с остальными и это осознанно:
  # мажор экшена надо видеть глазами (первый его выход, PR #188, привёз checkout
  # 4→7 и setup-python 5→7 — набор входов не изменился, поехал только рантайм Node).
  #
  # Пин ТЕГОМ, а не SHA — решение основателя от 04.08 по итогам ревью PR #188.
  # Тег подвижен: владелец чужого репозитория может перевесить его на другой
  # коммит, и мы исполним новый код молча (класс инцидента `tj-actions`, 2025).
  # Массовый пин по SHA отклонён: оба наших экшена — первосторонние, от самого
  # GitHub, а 40 символов вместо `@v7` платит читаемостью основатель, который по
  # этим файлам учится. Взамен закрыт более вероятный путь: Settings → Actions →
  # разрешены только экшены GitHub, то есть третьесторонний экшен нельзя завести
  # молча. **Правило: первый не-`actions/*` экшен пинится по SHA с первого дня**,
  # и тогда же включается `sha_pinning_required` в настройках репозитория.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
