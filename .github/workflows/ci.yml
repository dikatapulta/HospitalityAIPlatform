# CI/CD-пайплайн.
#   changes                 — #1057: PR только с документами идёт лёгким путём.
#   lint + tests → check    — Task 0002/0004: проверки идентичны `make check` (P-12);
#                             тесты — тремя частями параллельно, порог покрытия — в check (#1057);
#                             в lint — и разбор JS движком Node (#1056).
#   docs-tests → check      — лёгкий путь (#1057): тесты, читающие документы.
#   dev-environment         — Task 0004: образ собирается, compose поднимается.
#   deploy-staging          — Task 0006: катит main на staging после зелёного CI.
#   alert-red-main          — issue #413: красный main → сообщение в канал команды.
# Smoke с живой моделью — отдельный workflow smoke.yml: он платит за каждый
# прогон и запускается только руками, по «да» основателя (spec 0019).
# R-9: Definition of Done = зелёный CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # ручной триггер деплоя (кнопка в Actions / `make deploy-staging`)

# Новый push в PR отменяет прогон прежней головы: её результат уже никому не нужен,
# а очередь слияния (ops/pool-merge.sh) ждёт check новой. Push в main и ручной запуск
# не отменяются и не ждут друг друга — у каждого прогона своя группа (run_id): за ним деплой.
# Друг друга ждут только их job deploy-staging — у неё своя группа (issue #286, ниже).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Что меняет прогон (#1057, аудит процесса 11.11, Р-1). Очередь слияния ждёт `check`
  # каждого PR по одному, а 42 % слияний — только документы. Решает
  # src/hospitality/tools/ci_scope.py (системный python3, до установки зависимостей):
  #   light=true     — PR только с документами: его `check` — job docs-tests, без линтеров,
  #                    типов, миграций и сборки образа;
  #   docs_only=true — то же на push в main: проверки полные (промах отбора docs-tests
  #                    краснит main сразу, алертом), деплоя нет — в образ документы не едут.
  # Документы — docs/ без docs/legal (её текст приложение отдаёт гостю) и .md в корне.
  # Сомнение — полный путь.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      light: ${{ steps.scope.outputs.light }}
    steps:
      # Глубина 2: проверочный merge-коммит PR с обоими родителями или коммит push с прежней головой.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Только документы?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: python3 -I src/hospitality/tools/ci_scope.py --event "$EVENT" --before "$BEFORE" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: ./ops/install-deps.sh dev

      - name: Format check (ruff format)
        run: ruff format --check src tests alembic

      - name: Lint (ruff check)
        run: ruff check src tests alembic

      - name: Import boundaries (import-linter, R-5)
        run: lint-imports

      - name: Type check (mypy strict)
        run: mypy

      # Разбор JS кабинета и гостевых страниц (#1056 п. 3) — src/hospitality/tools/js_check.py.
      # Node закреплён той же версией, что на Mac пула (`make check`): проверку проверки
      # в начале шага каждая новая версия проходит заново.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: JS syntax (node --check)
        run: python -m hospitality.tools.js_check

  # Тесты — тремя частями параллельно (#1057): одним job прогон шёл 11 минут из 12.
  # Часть выбирает tests/ci_select.py по CI_TEST_SHARD — каждый файл тестов ровно в одной
  # части. Порог покрытия у части выключен: его считает job check по данным всех трёх.
  tests:
    name: tests
    needs: changes
    if: ${{ needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # Красная часть не гасит остальные: все падения PR видны за один прогон.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Тесты слоя БД (Task 0008) гоняются на настоящем Postgres — том же образе,
    # что и локальный `make dev`. Параметры совпадают с дефолтами Settings.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hospitality
          POSTGRES_PASSWORD: hospitality
          POSTGRES_DB: hospitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitality -d hospitality"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: ./ops/install-deps.sh dev

      # Процессов — по ядрам раннера (#527): замер 29.10 — 4 процесса 6:40, 2 — 7:20, один — 8:11.
      # `make check` локально берёт 2: окна пула делят один Mac. nproc — в лог: число воркеров.
      # Данные покрытия — под именем части: job check сводит три файла.
      - name: Tests (pytest), часть ${{ matrix.shard }}
        env:
          CI_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          nproc
          pytest -n auto --cov-fail-under=0 --cov-report=
          mv .coverage "coverage-${{ matrix.shard }}"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # Task 0009, P-4: отдельный шаг, чтобы тест изоляции был виден как
      # самостоятельный блокер и не мог исчезнуть незаметно — pytest падает
      # (exit code 5), если файл переименован/пуст и тесты не собрались.
      # Одна часть, файл целиком; --no-cov: покрытие считает job check.
      - name: "Изоляция тенантов — обязательный тест (падение = блокер, навсегда)"
        if: ${{ matrix.shard == 1 }}
        run: pytest tests/test_tenant_isolation.py --no-cov

  # Лёгкий путь PR только с документами (#1057): файлы тестов, читающие документы, —
  # отбор tests/ci_select.py по CI_TEST_SCOPE. Postgres — как у tests: часть отобранных
  # файлов ходит в базу.
  docs-tests:
    name: docs-tests
    needs: changes
    if: ${{ needs.changes.outputs.light == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hospitality
          POSTGRES_PASSWORD: hospitality
          POSTGRES_DB: hospitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitality -d hospitality"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: ./ops/install-deps.sh dev

      - name: Тесты, читающие документы (pytest)
        env:
          CI_TEST_SCOPE: docs
        run: pytest -n auto --no-cov

  # Required check защиты main (R-9) — только эта job, её имя не менять: его ждут защита
  # ветки и очередь слияния (ops/pool-merge.sh). Итог пути, который выбрала changes:
  # полный — lint и все части tests зелёные и порог покрытия по их сумме; лёгкий —
  # зелёная docs-tests. always(): пропущенная job защита ветки считала бы зелёной,
  # а здесь отмена или провал любой нужной — красный check.
  check:
    name: check
    needs: [changes, lint, tests, docs-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Итог пути
        env:
          CHANGES: ${{ needs.changes.result }}
          LIGHT: ${{ needs.changes.outputs.light }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          DOCS_TESTS: ${{ needs.docs-tests.result }}
        run: |
          failed=0
          require() {
            if [ "$2" = success ]; then echo "$1: success"; else echo "::error::$1: $2"; failed=1; fi
          }
          require changes "$CHANGES"
          if [ "$LIGHT" = true ]; then
            echo "Лёгкий путь: PR только с документами (#1057)."
            require docs-tests "$DOCS_TESTS"
          else
            require lint "$LINT"
            require tests "$TESTS"
          fi
          exit "$failed"

      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.light != 'true' }}

      - uses: actions/setup-python@v7
        if: ${{ needs.changes.outputs.light != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ needs.changes.outputs.light != 'true' }}
        run: ./ops/install-deps.sh dev

      - uses: actions/download-artifact@v8
        if: ${{ needs.changes.outputs.light != 'true' }}
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      # Порог — fail_under в [tool.coverage.report] pyproject.toml, тот же, что у `make check`.
      - name: Порог покрытия по всем частям (coverage)
        if: ${{ needs.changes.outputs.light != 'true' }}
        run: |
          coverage combine coverage-data/coverage-*
          coverage report

  # Известные уязвимости в зависимостях (аудит покрытия 30.07). Это класс,
  # который аудитор-LLM не находит в принципе: CVE в транзитивной зависимости не
  # видна при чтении собственного кода. Отдельная job, а не шаг в `check`:
  #   * своё имя в списке check-runs — не растворяется среди линтеров;
  #   * required check у main — только `check` (см. protection), поэтому свежая
  #     CVE в чужом пакете красит PR, но НЕ блокирует merge. Это осознанно:
  #     апстримный фикс не всегда существует в момент находки.
  #
  # Два шага (#184): в образ едет только рантайм (`ops/install-deps.sh runtime`),
  # а job ставит ещё и dev-инструменты — CVE в ruff или pytest выглядела бы так же,
  # как CVE в fastapi. Какой шаг красный, тот и ответ:
  #   * красный «Рантайм» — уязвимая версия в образе, то есть на staging и у отеля.
  #     Поднять пакет в локе (`make lock ARGS="--upgrade-package <имя>"`, обычно
  #     это уже сделал PR Dependabot) и смержить первым. Фикса нет — прочитать
  #     описание: уязвимый путь достижим из нашего кода — issue в приватном
  #     репозитории (правило 9 плана, «Уязвимость»), нет — игнор;
  #   * красный только «Всё окружение» — инструмент, в образ он не попадает.
  #     Поднять обычным PR, фикса нет — игнор с причиной «только dev».
  # Игнор — `--ignore-vuln GHSA-…` в красном шаге, с датой, причиной и условием
  # снятия; рантайм-находку — в обоих шагах. Пустой список игноров — норма.
  #
  # pip-audit сам стоит в `[dev]`, значит и в обязательном `check` (#184) — так
  # и оставлено: версию его и всего его дерева держит uv.lock (ADR-026), `check`
  # его не запускает, новая версия приходит только PR на лок, который проходит
  # тот же `check`. История с ruff — инструмент обновился сам и покрасил CI —
  # с локом невозможна.
  #
  # audit, migrations и dev-environment PR только с документами не гоняет (#1057):
  # ни зависимостей, ни миграций, ни образа он не меняет.
  audit:
    name: audit
    needs: changes
    if: ${{ needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: ./ops/install-deps.sh dev

      # Ровно тот список, что ставит `ops/install-deps.sh runtime`: та же команда
      # `uv export` без `--extra dev` (меняешь её флаги там — поменяй здесь и
      # в `make audit`). Список с точными версиями и хэшами — pip-audit сверяет
      # его с базой, ничего не устанавливая (`--disable-pip`).
      - name: "Рантайм — то, что едет в образ (pip-audit по uv.lock без dev)"
        run: |
          python -m uv export --locked --no-emit-project --format requirements-txt --quiet --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          pip-audit --desc --disable-pip --require-hashes -r "$RUNNER_TEMP/runtime-requirements.txt"

      # Красный рантайм не прячет этот шаг: вместе они и отвечают, рантайм это
      # или инструмент.
      # --skip-editable: сам `hospitality-platform` установлен editable и на PyPI
      # его нет — аудировать нечего. Без флага pip-audit падает на своём же
      # пакете. `--strict` (падать, если пропущена ЛЮБАЯ зависимость) с этим
      # флагом несовместим — он считает ошибкой и осознанный пропуск; проверено
      # 30.07 на обоих вариантах. На найденную уязвимость pip-audit отдаёт
      # ненулевой код и без `--strict` — то есть смысл шага сохранён.
      - name: "Всё окружение CI — рантайм и dev-инструменты (pip-audit)"
        if: ${{ !cancelled() }}
        run: pip-audit --desc --skip-editable

  # Task 0008: миграции применяются на чистый Postgres, и модели не разошлись
  # с историей миграций (`alembic check` падает, если autogenerate нашёл diff).
  migrations:
    name: migrations
    needs: changes
    if: ${{ needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hospitality
          POSTGRES_PASSWORD: hospitality
          POSTGRES_DB: hospitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospitality -d hospitality"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: ./ops/install-deps.sh runtime

      - name: alembic upgrade head (чистая БД)
        run: alembic upgrade head

      - name: alembic check (модели == миграции)
        run: alembic check

      - name: alembic downgrade base && upgrade head (миграции обратимы)
        run: |
          alembic downgrade base
          alembic upgrade head

  dev-environment:
    name: dev-environment
    needs: changes
    if: ${{ needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app image (ops/Dockerfile)
        run: docker compose -f ops/docker-compose.yml --env-file .env.example build app

      - name: "Проверка среды (Task 0004): compose поднимается, Postgres и Redis отвечают"
        run: ./ops/env-check.sh

  # Деплой на staging (Task 0006). Идёт только после зелёных check + dev-environment,
  # только на push в main или ручной запуск. Пока секреты VPS не заданы — job
  # грациозно пропускается (main не краснеет до провижининга сервера).
  # Push из одних документов не деплоит (#1057): в образ они не едут, а сервер staging
  # общий с копией отеля. Код, не выкаченный из-за красного прогона, выкатит следующий
  # push с кодом или ручной запуск (`make deploy-staging`).
  deploy-staging:
    name: deploy-staging
    needs: [changes, check, migrations, dev-environment]
    if: ${{ needs.changes.outputs.docs_only != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    # Один деплой за раз (issue #286): два merge подряд иначе дают два прогона внахлёст —
    # второй scp переписывает deploy.sh под работающим первым, оба мигрируют одну базу.
    # Начатый деплой не отменяют (cancel-in-progress: false) — обрыв посреди миграции хуже
    # ожидания. Ждущий прогон, который обогнал более новый, GitHub отменяет сам: новый main
    # несёт и его коммиты. На PR и на push из одних документов job пропущена своим if,
    # и группа у неё своя на прогон — пропущенная job не должна вытеснить ждущий деплой
    # main. Ручной ./deploy.sh на сервере ждёт замок в самом deploy.sh.
    concurrency:
      group: ${{ (github.event_name == 'pull_request' || needs.changes.outputs.docs_only == 'true') && format('deploy-staging-skip-{0}', github.run_id) || 'deploy-staging' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push образа в GitHub Container Registry (GHCR)
    steps:
      - uses: actions/checkout@v7

      # Если STAGING_SSH_HOST не задан — сервера ещё нет, деплой пропускаем.
      - name: Проверить, настроен ли staging
        id: guard
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -z "$STAGING_SSH_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секрет STAGING_SSH_HOST не задан — деплой пропущен. Настройте VPS по docs/runbooks/deploy.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Имя образа GHCR обязано быть в нижнем регистре. Имя пакета фиксировано —
      # `hospitality-app`; из репозитория берём только владельца. Так имя не зависит
      # от имени репозитория и совпадает с runbook (P-12: одно каноническое имя).
      - name: Вычислить тег образа
        if: steps.guard.outputs.configured == 'true'
        id: image
        run: |
          owner_lower="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner_lower}/hospitality-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "staging=ghcr.io/${owner_lower}/hospitality-app:staging" >> "$GITHUB_OUTPUT"

      - name: Login в GHCR
        if: steps.guard.outputs.configured == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Собрать и запушить production-образ
        if: steps.guard.outputs.configured == 'true'
        run: |
          docker build -f ops/Dockerfile --target production \
            -t "${{ steps.image.outputs.ref }}" \
            -t "${{ steps.image.outputs.staging }}" .
          docker push "${{ steps.image.outputs.ref }}"
          docker push "${{ steps.image.outputs.staging }}"

      - name: Настроить SSH
        if: steps.guard.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Скопировать конфиг деплоя на сервер
        if: steps.guard.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /opt/hospitality/cloudflared"
          scp -i ~/.ssh/id_deploy -P "${SSH_PORT:-22}" \
            ops/deploy/docker-compose.staging.yml ops/deploy/deploy.sh ops/backup/backup.sh \
            "$SSH_USER@$SSH_HOST:/opt/hospitality/"
          scp -i ~/.ssh/id_deploy -P "${SSH_PORT:-22}" \
            ops/deploy/cloudflared/config.yml \
            "$SSH_USER@$SSH_HOST:/opt/hospitality/cloudflared/"

      - name: Выкатить и прогнать post-deploy smoke
        if: steps.guard.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "chmod +x /opt/hospitality/deploy.sh && /opt/hospitality/deploy.sh '${{ steps.image.outputs.ref }}'"

  # Красный main — сообщение в Telegram-канал команды (issue #413, ERR-OPS-013):
  # уведомления GitHub Actions по умолчанию выключены, и красный main висел ≈50 ч,
  # пока кто-то случайно не открыл Actions. failure() здесь — «упала любая job из
  # needs»; на PR job пропускается. Секретов TELEGRAM_ALERT_* нет — notice, job
  # зелёная. Копия job — в smoke.yml; текст — hospitality.tools.ci_alert.
  alert-red-main:
    name: alert-red-main
    needs: [changes, lint, tests, check, audit, migrations, dev-environment, deploy-staging]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: ./ops/install-deps.sh runtime

      # Заголовок коммита — через env, а не подстановкой в run: текст коммита
      # не должен стать командой оболочки.
      - name: Сообщить в канал команды (ERR-OPS-013)
        env:
          TELEGRAM_ALERT_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: python -m hospitality.tools.ci_alert
