# Staging-стек (Task 0006). Живёт НА сервере в $DEPLOY_DIR, запускается
# скриптом ops/deploy/deploy.sh — вручную или из CI по SSH.
#
# Отличия от локального ops/docker-compose.yml:
#   - app берётся готовым образом из GHCR (${APP_IMAGE}), а НЕ собирается здесь —
#     на сервере крутится ровно тот артефакт, что прошёл CI.
#   - restart: unless-stopped — стек переживает перезагрузку VPS.
#   - наружу НЕ открыт ни один порт: вход идёт через именованный Cloudflare-туннель
#     (сервис cloudflared), держащий исходящее соединение. app/db/redis доступны
#     лишь внутри compose-сети — минимальная поверхность атаки, TLS у Cloudflare.
#
# Секреты (POSTGRES_*, CLOUDFLARED_CREDS_FILE) читаются из .env рядом с этим
# файлом (см. .env.staging.example). APP_IMAGE при деплое подставляет deploy.sh и
# после успеха записывает его строкой в .env — поэтому ручные
# `docker compose ...`-команды из runbook'ов работают без подготовки.

# Ротация логов контейнеров (issue #230) — одна на все сервисы. Умолчание Docker
# (json-file без предела) копит лог вечно на том же диске, что и БД: поллинг
# веб-чата (5 с) и кабинета (15 с) пишет строку `http_request` на каждый запрос,
# и кончившееся место роняет Postgres (ERR-OPS-001). Предел — 3 файла по 50 МБ
# на контейнер: шесть сервисов двух контуров (staging и гостевая копия) — не
# больше 1,8 ГБ. `docker compose logs` читает и повёрнутые файлы; старше этого
# объёма история уходит. Применяется при пересоздании контейнера — его делает
# ближайший деплой, потому что сменился конфиг сервиса.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # APP_IMAGE обязателен: без него deploy не знает, какую версию катить.
    image: ${APP_IMAGE:?APP_IMAGE не задан (ghcr.io/<owner>/hospitality-app:<sha>)}
    restart: unless-stopped
    logging: *logging
    # Один uvicorn-воркер (Task 0019): реестр Prometheus живёт в процессе, и при
    # --workers 2 (CMD образа) /metrics отдаёт счётчики случайного из двух
    # воркеров — алертер и smoke видят половину картины. Пока нагрузка staging
    # копеечная, честные метрики важнее второго воркера; multiprocess-реестр —
    # Phase 1 (issue в трекере).
    # --no-proxy-headers обязателен, а не украшение (issue #207): у uvicorn
    # proxy_headers ВКЛЮЧЁН ПО УМОЛЧАНИЮ (default=True), прослойка встаёт в стек
    # сама, и выключить её можно только явным флагом. Инертной её держит второй
    # дефолт, forwarded_allow_ips=127.0.0.1 (адрес cloudflared в docker-сети под
    # него не попадает), но он сдвигается переменной FORWARDED_ALLOW_IPS из .env
    # — без всякого флага. Тогда адрес клиента подменяется значением из
    # X-Forwarded-For (при * — САМЫМ ЛЕВЫМ элементом, то есть ровно тем, что
    # подделал клиент), и проверка «сосед по сокету — доверенный прокси»
    # (shared/clientip.py, TRUSTED_PROXY_IPS ниже) начнёт проверять подделку.
    # С флагом адрес сокета настоящий по построению, FORWARDED_ALLOW_IPS
    # перестаёт быть рычагом, а настоящий адрес приложение берёт само из
    # CF-Connecting-IP. Тот же флаг стоит в CMD образа (ops/Dockerfile) — здесь
    # он повторён потому, что command переопределяет CMD целиком.
    command: ["uvicorn", "hospitality.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Без default'а намеренно (:?): staging без заданного токена обязан упасть
      # на деплое, а не подняться с общеизвестным dev-значением из кода (§11).
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN не задан — добавьте в .env (см. .env.staging.example)}
      SERVICE_TOKEN_TENANT_SLUG: ${SERVICE_TOKEN_TENANT_SLUG:-demo-hotel}
      # Настоящий адрес клиента за туннелем (issue #207): app стоит за
      # cloudflared, и без этой настройки все входы отеля приходят с адреса
      # соседнего контейнера — общий бюджет попыток входа кончался на 11-м
      # сотруднике. Доверяем заголовку CF-Connecting-IP от соседей по
      # docker-сети: наружу порт не открыт (expose ниже), в сети только наши
      # контейнеры. Диапазон — пул адресов docker по умолчанию
      # (172.17.0.0/16 … 172.31.0.0/16). Сеть с адресами вне пула → в логах
      # `client_ip.untrusted_proxy_header`, и сюда нужно вписать её подсеть.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      # Лимиты попыток входа персонала и гостя (issue #486 п. 3): рунбук errors.md
      # велит поднять их в .env, когда живая смена упёрлась в лимит (ERR-AUTH-006,
      # ERR-WEB-004, ERR-WEB-005; гостевые — и рунбук ERR-OPS-014, issue #415),
      # — без проброса строка .env до контейнера не доедет.
      # Умолчания — те же, что в коде (shared/config.py; сверяет
      # tests/test_compose_rate_limits.py).
      STAFF_LOGIN_RATE_LIMIT_ATTEMPTS: ${STAFF_LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      STAFF_LOGIN_IP_RATE_LIMIT_ATTEMPTS: ${STAFF_LOGIN_IP_RATE_LIMIT_ATTEMPTS:-60}
      STAFF_LOGIN_IP_FLOOD_RATE_LIMIT_ATTEMPTS: ${STAFF_LOGIN_IP_FLOOD_RATE_LIMIT_ATTEMPTS:-600}
      STAFF_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${STAFF_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-600}
      GUEST_CODE_VERIFY_RATE_LIMIT_ATTEMPTS: ${GUEST_CODE_VERIFY_RATE_LIMIT_ATTEMPTS:-10}
      GUEST_CODE_VERIFY_RATE_LIMIT_WINDOW_SECONDS: ${GUEST_CODE_VERIFY_RATE_LIMIT_WINDOW_SECONDS:-600}
      GUEST_CODE_VERIFY_IP_RATE_LIMIT_ATTEMPTS: ${GUEST_CODE_VERIFY_IP_RATE_LIMIT_ATTEMPTS:-60}
      GUEST_BIND_LINK_CONSUME_RATE_LIMIT_ATTEMPTS: ${GUEST_BIND_LINK_CONSUME_RATE_LIMIT_ATTEMPTS:-60}
      GUEST_BIND_LINK_CONSUME_RATE_LIMIT_WINDOW_SECONDS: ${GUEST_BIND_LINK_CONSUME_RATE_LIMIT_WINDOW_SECONDS:-600}
      # Остальные рычаги рунбуков у app (issue #261): лимит гостевого чата
      # (ERR-CHANNEL-003 велит поднять его в .env), выпуск QR листка
      # (ERR-AUTH-010), сроки сессий, приглашений и ссылок сброса пароля.
      # Каждое имя .env.example стоит в env своих процессов обоих compose —
      # сверяет tests/test_compose_env_passthrough.py.
      GUEST_CHAT_RATE_LIMIT_MESSAGES: ${GUEST_CHAT_RATE_LIMIT_MESSAGES:-20}
      GUEST_CHAT_RATE_LIMIT_WINDOW_SECONDS: ${GUEST_CHAT_RATE_LIMIT_WINDOW_SECONDS:-600}
      GUEST_CHAT_RATE_LIMIT_MESSAGES_PER_DAY: ${GUEST_CHAT_RATE_LIMIT_MESSAGES_PER_DAY:-200}
      GUEST_CHAT_DAILY_BUDGET_SHARE: ${GUEST_CHAT_DAILY_BUDGET_SHARE:-0.1}
      GUEST_BIND_LINK_ISSUE_RATE_LIMIT_ATTEMPTS: ${GUEST_BIND_LINK_ISSUE_RATE_LIMIT_ATTEMPTS:-30}
      GUEST_BIND_LINK_ISSUE_RATE_LIMIT_WINDOW_SECONDS: ${GUEST_BIND_LINK_ISSUE_RATE_LIMIT_WINDOW_SECONDS:-600}
      STAFF_SESSION_IDLE_TTL_DAYS: ${STAFF_SESSION_IDLE_TTL_DAYS:-30}
      STAFF_SESSION_ABSOLUTE_TTL_DAYS: ${STAFF_SESSION_ABSOLUTE_TTL_DAYS:-180}
      STAFF_SESSION_SHORT_IDLE_MINUTES: ${STAFF_SESSION_SHORT_IDLE_MINUTES:-15}
      STAFF_INVITE_TTL_HOURS: ${STAFF_INVITE_TTL_HOURS:-72}
      STAFF_INVITE_ISSUE_RATE_LIMIT_ATTEMPTS: ${STAFF_INVITE_ISSUE_RATE_LIMIT_ATTEMPTS:-1000}
      STAFF_INVITE_ISSUE_RATE_LIMIT_WINDOW_SECONDS: ${STAFF_INVITE_ISSUE_RATE_LIMIT_WINDOW_SECONDS:-86400}
      STAFF_SUPERADMIN_SESSION_TTL_MINUTES: ${STAFF_SUPERADMIN_SESSION_TTL_MINUTES:-60}
      STAFF_PASSWORD_RESET_TTL_HOURS: ${STAFF_PASSWORD_RESET_TTL_HOURS:-24}
      # Внешний адрес инсталляции: из него собирается ссылка на политику
      # конфиденциальности в тексте согласия гостя (spec 0029 §2). Без проброса
      # ссылка указывала бы на localhost — гость по ней не пройдёт.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://staging.necturn.com}
      # AI Gateway (Task 0014, §7.2): пустой ключ валиден (боевой провайдер просто
      # не соберётся) — без default'а :? здесь не нужен, в отличие от SERVICE_TOKEN.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Ключ второго провайдера (ADR-020): нужен, только если LLM_MODEL — модель
      # OpenAI; без проброса строка из .env до контейнера не доедет (docs-drift H-2).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      # Режим «только консультации»: false (умолчание) — AI-инструмент создания
      # заявки не передаётся модели вовсе. Проброс обязателен, иначе строка в
      # .env до контейнера не доедет (docs-drift H-2) и вернуть заявки будет
      # нечем. Нужен только app: заявки создаёт оркестратор гостевого диалога,
      # а вызов LLM воркером (перевод сути заявки, баг #71) инструментов не
      # объявляет.
      ENABLE_SERVICE_REQUESTS: ${ENABLE_SERVICE_REQUESTS:-false}
      # Демо «Передача смены» (issue #450): умолчание false — страницы нет.
      ENABLE_DEMO_HANDOVER: ${ENABLE_DEMO_HANDOVER:-false}
      # Демо «Забытые вещи» (#604): умолчание false.
      ENABLE_DEMO_LOST_FOUND: ${ENABLE_DEMO_LOST_FOUND:-false}
      # Пункты-ссылки «Наставник» и «Кодекс отеля» (issue #628): пусто — пунктов нет.
      DEMO_MENTOR_URL: ${DEMO_MENTOR_URL:-}
      DEMO_CODEX_URL: ${DEMO_CODEX_URL:-}
      # Пункт-ссылка «3D-модель» менеджеру (issue #792): пусто — пункта нет.
      DEMO_3D_URL: ${DEMO_3D_URL:-}
      # Касса — только ручной бланк (issue #469): гостевая копия.
      ENABLE_HANDOVER_MANUAL: ${ENABLE_HANDOVER_MANUAL:-false}
      # Доска «Выезды и уборка» (issue #476, spec 0046 §5): умолчание false —
      # раздела нет; гостевая копия — только после согласования с отелем.
      ENABLE_TURNOVER_BOARD: ${ENABLE_TURNOVER_BOARD:-false}
      # Доска «Номера» (issue #666, spec 0061 §7): умолчание false — раздела нет;
      # только вместе с доской выездов.
      ENABLE_ROOM_BOARD: ${ENABLE_ROOM_BOARD:-false}
      # Этажи хаускипинга (issue #478, spec 0053 §7): умолчание false — раздела нет,
      # заявки уборки зовут всю службу; гостевая копия — после согласования с
      # отелем. Читает и worker (рассылка пуша) — проброс там же.
      ENABLE_HOUSEKEEPING_FLOORS: ${ENABLE_HOUSEKEEPING_FLOORS:-false}
      # Страница «Статистика» (issue #704, spec 0065 §2.4): умолчание false — пункта
      # нет; гостевая копия — после уведомления сотрудников. Читает только app.
      ENABLE_STAFF_STATS: ${ENABLE_STAFF_STATS:-false}
      # Лист «Отчёт» (issue #950, spec 0083 §2.5): умолчание false — пункта нет;
      # гостевая копия — по слову основателя. Читает только app.
      ENABLE_MANAGER_REPORT: ${ENABLE_MANAGER_REPORT:-false}
      # Раздел «Диалоги» (issue #767, spec 0067 §2.6): умолчание false — пункта нет;
      # гостевая копия — по подписанному допсоглашению. Читает только app.
      ENABLE_STAFF_CONVERSATIONS: ${ENABLE_STAFF_CONVERSATIONS:-false}
      # Реквизиты для АВР от гостя (spec 0049 Р-7): умолчание false — скрепки и
      # пункта «Документы для АВР» нет; живые гости — после переезда в РК.
      ENABLE_GUEST_DOCUMENTS: ${ENABLE_GUEST_DOCUMENTS:-false}
      # Staging показывает всё из main (#940): true включает все ENABLE_* выше и
      # модели разделов (shared/staging_features.py), сид — флаги демо-отеля. Строка
      # только в .env staging; в .env копии отеля её нет — тот же compose-файл.
      STAGING_ALL_FEATURES: ${STAGING_ALL_FEATURES:-false}
      # Канал Telegram (Task 0016, §8.4): пустой TELEGRAM_WEBHOOK_SECRET закрывает
      # вебхук (fail-closed) — тоже без :?, staging без Telegram остаётся рабочим.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_TENANT_SLUG: ${TELEGRAM_TENANT_SLUG:-demo-hotel}
      # Staff-чат (Task 0017): app распознаёт по нему команды персонала во входящем
      # вебхуке; пустой = уведомления/команды службы выключены.
      TELEGRAM_STAFF_CHAT_ID: ${TELEGRAM_STAFF_CHAT_ID:-}
      # Тюнинг AI Gateway (runbook errors.md, ERR-AI-001/002): без проброса
      # значения из .env не доходят до контейнера (docs-drift H-2).
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30.0}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_RETRY_BACKOFF_BASE_SECONDS: ${LLM_RETRY_BACKOFF_BASE_SECONDS:-1.0}
      LLM_TENANT_DAILY_BUDGET_USD: ${LLM_TENANT_DAILY_BUDGET_USD:-10.0}
      # «Наставник» (ADR-024): своя модель и бюджет; пустая модель — выключен.
      LLM_MODEL_MENTOR: ${LLM_MODEL_MENTOR:-}
      LLM_MENTOR_DAILY_BUDGET_USD: ${LLM_MENTOR_DAILY_BUDGET_USD:-2.0}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      # Фото реквизитов моделью (spec 0049 Р-13): app модель не зовёт, но по этой
      # настройке форма говорит гостю, что фото прочитает ИИ (политика §6, #539).
      # Значение — то же, что у воркера: иначе форма скажет «видят только
      # сотрудники», пока модель читает фото.
      LLM_MODEL_DOCUMENTS: ${LLM_MODEL_DOCUMENTS:-}
      # Помощник 3D-витрины (spec 0069 §2.3): своя модель и бюджет; пустая модель —
      # выключен, страница работает правилами и кнопками.
      LLM_MODEL_SHOWROOM: ${LLM_MODEL_SHOWROOM:-}
      LLM_SHOWROOM_DAILY_BUDGET_USD: ${LLM_SHOWROOM_DAILY_BUDGET_USD:-1.0}
      # «Предложить идею» и интервью служб (spec 0071 §7): своя модель и бюджет;
      # пустая модель — выключено.
      LLM_MODEL_IDEAS: ${LLM_MODEL_IDEAS:-}
      LLM_IDEAS_DAILY_BUDGET_USD: ${LLM_IDEAS_DAILY_BUDGET_USD:-2.0}
      # Наблюдаемость (Task 0018, §10.4): пустой SENTRY_DSN = Sentry выключен.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Имя контура (#389): окружение событий Sentry и префикс алертов. Пусто —
      # staging; гостевая копия отеля ставит в своём .env `pilot` (pilot-copy.md).
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
      # Версия кода (#411): тег образа — release событий Sentry и поле `version`
      # в /health/ready. Тот же APP_IMAGE, по которому поднят контейнер.
      APP_IMAGE: ${APP_IMAGE}
      # Хранилище файлов (spec 0047, ADR-022): том files_data ниже, файлы на нём
      # зашифрованы ключом FILE_ENCRYPTION_KEY (docs/runbooks/secrets.md). Пустой
      # ключ = приём и выдача файлов отвечают ERR-FILES-005, остальное работает.
      # Без проброса строка .env до контейнера не дошла бы (класс #486 п. 3).
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      FILE_STORAGE_ROOT: /var/lib/hospitality/files
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-}
      # Антивирус для PDF и DOCX гостя (spec 0075): умолчание clamav — контур, где
      # включат документы гостя, без сервиса clamav файл не примет (ERR-FILES-008),
      # а не примет непроверенным. Staging на выдуманных данных — `fake` в .env.
      # Файлы принимает только app.
      VIRUS_SCAN_BACKEND: ${VIRUS_SCAN_BACKEND:-clamav}
      # Погода и официальный курс для консьержа (spec 0084): открытые источники без
      # ключа — MET Norway и Национальный банк РК. Спрашивает их только ход гостя в app,
      # и только при ENABLE_CONCIERGE_CITY: умолчание false — блока нет; гостевая копия —
      # по слову основателя (docs/runbooks/pilot-copy.md).
      ENABLE_CONCIERGE_CITY: ${ENABLE_CONCIERGE_CITY:-false}
      WEATHER_BACKEND: ${WEATHER_BACKEND:-met_norway}
      EXCHANGE_RATES_BACKEND: ${EXCHANGE_RATES_BACKEND:-nbk}
      # Источник проживаний (spec 0058 §2.1): адаптер Opera — маршрут приёма
      # выгрузки и снимок в БД. Сверка идёт только у отеля с `pms_source:
      # opera_report`; значение — то же, что у worker (снимок он читает из БД).
      PMS_BACKEND: ${PMS_BACKEND:-opera_report}
      # Уведомления на телефон (spec 0050 §8): пустой ключ = пуша нет — кнопки
      # на телефоне нет. Ключ — секрет (docs/runbooks/secrets.md).
      STAFF_PUSH_BACKEND: vapid
      STAFF_PUSH_VAPID_PRIVATE_KEY: ${STAFF_PUSH_VAPID_PRIVATE_KEY:-}
    # Том файлов: архив снимает ops/backup/backup.sh рядом с дампом БД.
    volumes:
      - files_data:/var/lib/hospitality/files
    # /tmp — в памяти (spec 0049 Р-8, ревью PR #495 Н-2): документ гостя до
    # шифрования не ложится открытым текстом на диск, даже если маршрут позовёт
    # `request.form()` мимо канона `platform/upload_form.py`.
    tmpfs:
      - /tmp:size=128m
    # Портов наружу нет намеренно: единственный вход — cloudflared (ниже),
    # который достаёт app по имени сервиса внутри compose-сети (http://app:8000).
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health/live не ходит в зависимости → показывает «процесс жив».
    # `docker compose up --wait` ждёт этот healthcheck; более глубокий
    # /health/ready проверяет deploy.sh после старта.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys,urllib.request; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health/live\").status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Антивирус для PDF и DOCX гостя (spec 0075): clamd и freshclam в одном
  # контейнере, базы сигнатур — в томе clamav_data, freshclam обновляет их сам.
  # Только с профилем `antivirus` (`COMPOSE_PROFILES=antivirus` в .env): по
  # документации ClamAV — 1,2 ГБ памяти и до 2,4 ГБ при ежедневной перезагрузке
  # баз, а нужен он лишь контуру, где включён приём документов гостя. Порт
  # наружу не открыт: app ходит к нему по сети compose (`clamav:3310`).
  # Healthcheck — из образа (`clamdcheck.sh`, старт до 6 минут: первый запуск
  # качает базы). Версия запинена (P-1), `_base` — образ без баз, они в томе.
  clamav:
    image: clamav/clamav:1.5.4_base-debian
    restart: unless-stopped
    logging: *logging
    profiles: ["antivirus"]
    volumes:
      - clamav_data:/var/lib/clamav

  # Постоянный HTTPS-вход (issue #65): именованный Cloudflare-туннель как сервис.
  # Держит исходящее соединение к Cloudflare — порт наружу не нужен. Конфиг
  # ingress и id туннеля — в ./cloudflared/config.yml (в репо); секретный JSON
  # туннеля монтируется с хоста по CLOUDFLARED_CREDS_FILE (не в репо). Версия
  # образа запинена (P-1: предсказуемость, не :latest).
  #
  # Healthcheck (#407): `tunnel ready` спрашивает /ready сервера метрик — 200, пока
  # есть хоть одно соединение с Cloudflare, иначе 503 и код 1. Процесс без
  # соединений живёт бесконечно и restart его не тронет — без проверки он «Up».
  # Даёт: `up --wait` в deploy.sh не считает деплой готовым, пока туннель не
  # соединился, а `docker compose ps` показывает зависший туннель как unhealthy.
  # Сам Docker unhealthy-контейнер не перезапускает: падение входа снаружи ловит
  # внешний монитор (docs/runbooks/founder-actions-pilot-launch.md, §6).
  # Адрес метрик задан явно и один в двух местах: без --metrics `ready` не
  # работает, а другой адрес у проверки — вечный unhealthy и красный деплой
  # (держит tests/test_compose_cloudflared_health.py).
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    logging: *logging
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "--config", "/etc/cloudflared/config.yml", "run"]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDS_FILE:?CLOUDFLARED_CREDS_FILE не задан — путь к JSON туннеля на хосте (см. .env.staging.example)}:/etc/cloudflared/creds.json:ro
    depends_on:
      app:
        condition: service_healthy

  # Воркер доменных событий (Task 0010, ADR-005): тот же образ, другая команда
  # (§5.3). Без healthcheck: `up --wait` считает его готовым по факту запуска;
  # мгновенное падение процесса деплой всё равно увидит (контейнер не running).
  worker:
    image: ${APP_IMAGE:?APP_IMAGE не задан (ghcr.io/<owner>/hospitality-app:<sha>)}
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "hospitality.worker"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Перевод сути заявки на русский для staff-чата (баг #71) делает ВОРКЕР —
      # отдельным вызовом LLM через ai/gateway при отправке уведомления. Поэтому
      # ему нужны ключ провайдера и модель, как и app; иначе перевод падает и
      # персонал видит оригинал на языке гостя (штатная деградация, но не цель).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      # Тюнинг AI Gateway (runbook errors.md, ERR-AI-001/002): без проброса
      # значения из .env не доходят до контейнера (docs-drift H-2).
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30.0}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_RETRY_BACKOFF_BASE_SECONDS: ${LLM_RETRY_BACKOFF_BASE_SECONDS:-1.0}
      LLM_TENANT_DAILY_BUDGET_USD: ${LLM_TENANT_DAILY_BUDGET_USD:-10.0}
      # «Наставник» (ADR-024): своя модель и бюджет; пустая модель — выключен.
      LLM_MODEL_MENTOR: ${LLM_MODEL_MENTOR:-}
      LLM_MENTOR_DAILY_BUDGET_USD: ${LLM_MENTOR_DAILY_BUDGET_USD:-2.0}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      # Фото реквизитов для АВР моделью (spec 0049 Р-13): разбор идёт здесь, app
      # читает ту же строку для подписи формы. Пустая модель — выключено; живым
      # гостям — по spec 0049 §8.
      LLM_MODEL_DOCUMENTS: ${LLM_MODEL_DOCUMENTS:-}
      LLM_DOCUMENTS_DAILY_BUDGET_USD: ${LLM_DOCUMENTS_DAILY_BUDGET_USD:-1.0}
      # Помощник 3D-витрины зовёт модель только из app; здесь — та же пара, чтобы
      # проверка старта (validate_configured_model) видела одну конфигурацию.
      LLM_MODEL_SHOWROOM: ${LLM_MODEL_SHOWROOM:-}
      LLM_SHOWROOM_DAILY_BUDGET_USD: ${LLM_SHOWROOM_DAILY_BUDGET_USD:-1.0}
      # «Предложить идею» зовёт модель только из app; здесь — та же пара для той же
      # проверки старта.
      LLM_MODEL_IDEAS: ${LLM_MODEL_IDEAS:-}
      LLM_IDEAS_DAILY_BUDGET_USD: ${LLM_IDEAS_DAILY_BUDGET_USD:-2.0}
      # Тюнинг доставки outbox (docs-drift H-2): дефолты — те же, что в config.py.
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1.0}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
      WORKER_MAX_DELIVERY_ATTEMPTS: ${WORKER_MAX_DELIVERY_ATTEMPTS:-10}
      WORKER_RETRY_BACKOFF_BASE_SECONDS: ${WORKER_RETRY_BACKOFF_BASE_SECONDS:-2.0}
      WORKER_RETRY_BACKOFF_MAX_SECONDS: ${WORKER_RETRY_BACKOFF_MAX_SECONDS:-300.0}
      WORKER_DELIVERY_LEASE_SECONDS: ${WORKER_DELIVERY_LEASE_SECONDS:-300.0}
      WORKER_CLEANUP_INTERVAL_SECONDS: ${WORKER_CLEANUP_INTERVAL_SECONDS:-3600.0}
      WORKER_DEAD_LETTER_ALERT_INTERVAL_SECONDS: ${WORKER_DEAD_LETTER_ALERT_INTERVAL_SECONDS:-60.0}
      # Пульс воркера (issue #136): отметка «цикл жив» в БД, по возрасту которой
      # алертер снаружи видит мёртвый или зависший процесс (ERR-OPS-003).
      # Без проброса значение из .env не дошло бы до контейнера (docs-drift H-2).
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-30.0}
      # Утреннее сообщение со сводкой дня (issue #301, spec 0035 §8) шлёт тоже
      # ВОРКЕР — раз в этот интервал он смотрит, у кого из отелей наступило
      # локальное время рассылки. Без проброса значение из .env не дошло бы до
      # контейнера (класс #261/#263). Время рассылки и чат менеджера — конфиг
      # ТЕНАНТА (`python -m hospitality.tools.daily_summary`), не окружение.
      WORKER_DAILY_SUMMARY_INTERVAL_SECONDS: ${WORKER_DAILY_SUMMARY_INTERVAL_SECONDS:-600.0}
      # Остальные периодические шаги воркера (issue #261, #263): срок хранения
      # строк outbox, частота ретеншна текстов гостя, напоминаний о невзятых
      # заявках, автовыезда, сверки со снимком Opera и рассылки пуша. Срок
      # ретеншна текстов (MESSAGES_RETENTION_DAYS) сюда не идёт намеренно —
      # почему, записано в tests/test_compose_env_passthrough.py.
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
      WORKER_RETENTION_INTERVAL_SECONDS: ${WORKER_RETENTION_INTERVAL_SECONDS:-3600.0}
      WORKER_REMINDER_INTERVAL_SECONDS: ${WORKER_REMINDER_INTERVAL_SECONDS:-300.0}
      WORKER_STAY_AUTO_CHECKOUT_INTERVAL_SECONDS: ${WORKER_STAY_AUTO_CHECKOUT_INTERVAL_SECONDS:-600.0}
      WORKER_PMS_SYNC_INTERVAL_SECONDS: ${WORKER_PMS_SYNC_INTERVAL_SECONDS:-60.0}
      WORKER_STAFF_PUSH_INTERVAL_SECONDS: ${WORKER_STAFF_PUSH_INTERVAL_SECONDS:-15.0}
      # Уведомления Telegram (Task 0017) шлёт ВОРКЕР (подписчики событий), поэтому
      # ему нужны токен бота и id staff-чата; секрет вебхука — нет (вебхуки у app).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_STAFF_CHAT_ID: ${TELEGRAM_STAFF_CHAT_ID:-}
      # Алерт о событиях, ушедших в dead-letter (issue #133), и копия утренней
      # сводки основателю (issue #301) шлёт тоже ВОРКЕР — он один знает и момент
      # похорон, и наступившее утро. Бот и чат — команды, те же, что у алертера
      # (не staff-чат отеля); пустая пара = шаг выключен, WARNING в логах.
      # Без этого проброса алерт молчал бы на staging при живом коде (docs-drift H-2).
      TELEGRAM_ALERT_BOT_TOKEN: ${TELEGRAM_ALERT_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # Наблюдаемость (Task 0018, §10.4): пустой SENTRY_DSN = Sentry выключен.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}  # имя контура, как у app (#389)
      APP_IMAGE: ${APP_IMAGE}  # версия кода в событиях Sentry (#411)
      # Ретеншн файлов гостя (spec 0047 §6) удаляет их с того же тома, что у app.
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      FILE_STORAGE_ROOT: /var/lib/hospitality/files
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-}
      # Сверка со снимком Opera (spec 0058 §2.2) — тот же адаптер, что у app.
      PMS_BACKEND: ${PMS_BACKEND:-opera_report}
      # Рассылка пуша на телефоны (spec 0050 §6) — тот же ключ, что у app.
      STAFF_PUSH_BACKEND: vapid
      STAFF_PUSH_VAPID_PRIVATE_KEY: ${STAFF_PUSH_VAPID_PRIVATE_KEY:-}
      # Рассылка строит тот же сигнал, что вкладка: номера доски выездов и этажи
      # (spec 0053 §4) — те же выключатели, что у app. Без проброса пуш «704 —
      # выезд» молчал бы при включённой доске (класс #486 п. 3).
      ENABLE_TURNOVER_BOARD: ${ENABLE_TURNOVER_BOARD:-false}
      ENABLE_HOUSEKEEPING_FLOORS: ${ENABLE_HOUSEKEEPING_FLOORS:-false}
      # Тот же выключатель, что у app (#940): иначе воркер видел бы доску и модель
      # фото выключенными, пока app показывает их включёнными.
      STAGING_ALL_FEATURES: ${STAGING_ALL_FEATURES:-false}
    volumes:
      - files_data:/var/lib/hospitality/files
    depends_on:
      db:
        condition: service_healthy

  # Алертер (Task 0018, §10.8): watchdog опрашивает /health/ready и /metrics
  # приложения и шлёт алерты в Telegram-канал команды. Тот же образ, другая
  # команда (§5.3, как worker). Намеренно БЕЗ depends_on и healthcheck: алертер
  # обязан жить и когда БД/приложение мертвы — иначе он не заалертит об этом.
  # Пустые TELEGRAM_ALERT_* = пассивный режим (WARNING в логах, деплой зелёный).
  #
  # LLM_MODEL и ключи провайдеров не пробрасываются НАМЕРЕННО (issue #267, ревью
  # PR #282). С #267 ENTRYPOINT образа проверяет модель по прайс-листу перед
  # ЛЮБОЙ его командой, включая эту: пробрось сюда LLM_MODEL — и опечатка в нём
  # уронит watchdog вместе с приложением, то есть ровно в том отказе, ради
  # которого watchdog существует (сейчас app и worker уходят в crash-loop, а
  # алертер это видит и шлёт ERR-OPS-001). Алертер к LLM не ходит, значение ему
  # не нужно, и дефолт из config.py заведомо годен. Это ограничение для #261
  # (машинная сверка .env.example с env сервисов): у алертера — исключение.
  alerter:
    image: ${APP_IMAGE:?APP_IMAGE не задан (ghcr.io/<owner>/hospitality-app:<sha>)}
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "hospitality.tools.alerter"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALERT_TARGET_BASE_URL: http://app:8000
      TELEGRAM_ALERT_BOT_TOKEN: ${TELEGRAM_ALERT_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # Пороги алертера (docs-drift H-2): дефолты — те же, что в config.py.
      # Первые четыре живут в Settings с Task 0018, но в контейнер не
      # пробрасывались — правка .env на сервере молча ничего не меняла;
      # две следующие — две линии issue #136 (ERR-OPS-003/004), затем порог
      # алерта о дневном бюджете LLM (ERR-OPS-006, issue #103) и серия отказов
      # провайдера (ERR-OPS-009, issue #374); все они названы в .env.example.
      ALERT_POLL_INTERVAL_SECONDS: ${ALERT_POLL_INTERVAL_SECONDS:-60.0}
      ALERT_READY_FAILURE_THRESHOLD: ${ALERT_READY_FAILURE_THRESHOLD:-2}
      ALERT_ERROR_SPIKE_THRESHOLD: ${ALERT_ERROR_SPIKE_THRESHOLD:-5}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-900.0}
      ALERT_LOGIN_RATE_LIMITED_THRESHOLD: ${ALERT_LOGIN_RATE_LIMITED_THRESHOLD:-1}
      ALERT_LOGIN_REJECTED_HOURLY_THRESHOLD: ${ALERT_LOGIN_REJECTED_HOURLY_THRESHOLD:-30}
      ALERT_MENTOR_TURN_FAILURES_THRESHOLD: ${ALERT_MENTOR_TURN_FAILURES_THRESHOLD:-3}
      ALERT_WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${ALERT_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-300.0}
      ALERT_OUTBOX_DEPTH_THRESHOLD: ${ALERT_OUTBOX_DEPTH_THRESHOLD:-100}
      ALERT_LLM_BUDGET_RATIO: ${ALERT_LLM_BUDGET_RATIO:-0.8}
      ALERT_LLM_FAILURE_STREAK_THRESHOLD: ${ALERT_LLM_FAILURE_STREAK_THRESHOLD:-3}
      # Отказы rate-limit у входа гостя в чат (ERR-OPS-014, issue #415).
      ALERT_GUEST_DOOR_THRESHOLD: ${ALERT_GUEST_DOOR_THRESHOLD:-1}
      # Свежесть бэкапа (issue #106): путь ВНУТРИ контейнера — тот, куда
      # смонтирован каталог бэкапов хоста (volumes ниже). Пустое значение
      # выключило бы линию, поэтому здесь оно задано явно, а не дефолтом.
      ALERT_BACKUP_DIR: /backups
      ALERT_BACKUP_MAX_AGE_HOURS: ${ALERT_BACKUP_MAX_AGE_HOURS:-30.0}
      # Место на диске сервера (issue #414): тот же смонтированный каталог —
      # он лежит на общей ФС хоста, statvfs по нему видит весь диск. Путь задан
      # явно по той же причине, что ALERT_BACKUP_DIR: пустой выключил бы линию.
      ALERT_DISK_PATH: /backups
      ALERT_DISK_MIN_FREE_RATIO: ${ALERT_DISK_MIN_FREE_RATIO:-0.15}
      # Тексты гостей старше срока (issue #410, ERR-OPS-017): запас сверх
      # MESSAGES_RETENTION_DAYS (90 — дефолт config.py у всех процессов).
      ALERT_GUEST_TEXT_RETENTION_GRACE_HOURS: ${ALERT_GUEST_TEXT_RETENTION_GRACE_HOURS:-48.0}
      # Сторож сторожа (issue #229): пульс на проверку внешнего сервиса — у
      # каждого контура свой адрес (secrets.md); пустой — пульса нет.
      ALERT_HEARTBEAT_URL: ${ALERT_HEARTBEAT_URL:-}
      # Префикс контура в тексте алерта — [staging], у копии отеля [pilot] (#389);
      # DSN — ошибки самого алертера в Sentry, как у app и worker (issue #229).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
      APP_IMAGE: ${APP_IMAGE}  # версия кода в событиях Sentry (#411)
    # Каталог бэкапов хоста — ЕДИНСТВЕННОЕ, что алертер видит вне docker-сети
    # (issue #106). Только для чтения: watchdog обязан уметь сказать «бэкапа
    # нет» и не иметь возможности что-либо с бэкапами сделать. Дампы он не
    # читает — ему нужны только имена файлов и их даты, поэтому права самих
    # файлов (0600) менять не потребовалось; каталогу нужен доступ «на вход»
    # для чужого uid (контейнер работает под 10001, каталог принадлежит deploy)
    # — его выставляет ops/backup/backup.sh.
    volumes:
      - ${BACKUP_DIR:-/opt/hospitality/backups}:/backups:ro

volumes:
  db_data:
  # Файлы тенантов (spec 0047, ADR-022): шифртекст; у гостевой копии свой том
  # (свой каталог = свой проект compose).
  files_data:
  # Базы сигнатур ClamAV (spec 0075) — только у контура с профилем antivirus;
  # в бэкап не идут: freshclam скачает их заново.
  clamav_data:
