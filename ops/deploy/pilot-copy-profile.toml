# Профиль копии отеля на запуске 01.12 (#1053 п. 3): что включено в её `.env` и в конфиге
# отеля, без секретов. По нему `tests/test_launch_profile.py` собирает приложение и сверяет,
# что отвечает каждая операция (таблица `tests/launch_profile_operations.py`).
#
# Источник каждой строки — абзац раздела в docs/runbooks/pilot-copy.md; план запуска — #897:
# копия обновляется на метку кандидата с моделью «Наставника», 01.12 включается флаг отеля.
# Раздел включили на копии (по слову основателя, абзацем рунбука) — строка здесь отдельным
# PR сразу после включения, и таблица операций правится тем же PR.
#
# Чего здесь нет — то на копии по умолчанию: выключатель `ENABLE_*` — false, модель раздела
# `LLM_MODEL_*` — пусто, флаг отеля `*_enabled` — false, у отеля нет `room_service` и
# `showroom`. Тест ставит умолчание каждому такому полю сам, `.env` машины его не меняет.

[env]
SENTRY_ENVIRONMENT = "pilot"          # «Метка контура» в pilot-copy.md (#389)
PMS_BACKEND = "opera_report"          # умолчание compose-файла копии
ENABLE_HANDOVER_MANUAL = "true"       # «Касса передачи смены» (#469)
LLM_MODEL_MENTOR = "gpt-6-luna"       # «Наставник» (docs/runbooks/mentor.md)

[tenant]
mentor_enabled = true                 # 01.12 — флаг отеля (#897, #1048)
