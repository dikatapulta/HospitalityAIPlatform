{# Иконки кабинета (issue #462, рисунок — макет staff-dashboard-v2): inline SVG
   атрибутами, без style — CSP кабинета (style-src 'self') инлайн-стили не
   пропускает. Цвет — currentColor, то есть цвет текста вокруг. #}
{% macro icon(name, size=20) -%}
<svg class="icon" aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "grid" %}<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
{%- elif name == "inbox" %}<path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/>
{%- elif name == "key" %}<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3"/><path d="M17 6l3 3"/><path d="M14.5 8.5l2 2"/>
{%- elif name == "tray" %}<path d="M3 18h18"/><path d="M4.5 18a7.5 7.5 0 0 1 15 0"/><path d="M12 8.5v-2"/><path d="M10 6.5h4"/>
{%- elif name == "handover" %}<path d="M4 8h14"/><path d="M14 4l4 4-4 4"/><path d="M20 16H6"/><path d="M10 12l-4 4 4 4"/>
{%- elif name == "chart" %}<path d="M5 20V11"/><path d="M11 20V5"/><path d="M17 20v-7"/><path d="M3 20h18"/>
{%- elif name == "history" %}<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/>
{%- elif name == "people" %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.8.7 3 2.5 3.5 5.2"/>
{%- elif name == "book" %}<path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 19a2 2 0 0 0 2 2h12v-3"/><path d="M9 7.5h6"/>
{%- elif name == "plus" %}<path d="M12 5v14"/><path d="M5 12h14"/>
{%- elif name == "logout" %}<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
{%- elif name == "moon" %}<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
{%- elif name == "bell" %}<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
{%- elif name == "arrow" %}<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
{%- elif name == "chevron" %}<path d="M9 6l6 6-6 6"/>
{%- elif name == "broom" %}<path d="M20 4l-7.5 7.5"/><path d="M11 10l3 3"/><path d="M10.5 10.5L5 14.5 9.5 19l4-5.5"/><path d="M7 16.5l-2.5 3"/>
{%- endif %}</svg>
{%- endmacro %}
