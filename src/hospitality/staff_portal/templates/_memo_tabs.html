{# Полоса вкладок «Служебных записок» (spec 0077 §9): контекст — memos.build_page (tabs, tab,
   hint). Вкладки — сегменты, как у «Предложить идею» (mentor.css). #}
<p class="hint">{{ hint }}</p>
<nav class="tabs mentor-tabs" aria-label="Служебные записки">
  {% for item in tabs %}
  <a class="tab" href="{{ item.href }}"{% if item.key == tab %} aria-current="page"{% endif %}>{{ item.title }}</a>
  {% endfor %}
</nav>
